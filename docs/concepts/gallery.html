<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValoriaTycoon — Concepts spawn et zones</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #111713; color: #f5ead2; }
    header { padding: 36px 5vw 20px; background: linear-gradient(135deg,#17251b,#422d18); }
    h1 { margin: 0 0 8px; font-size: clamp(28px,5vw,54px); }
    header p { margin: 0; color: #d9c9a7; }
    main { width: min(1400px, 92vw); margin: 28px auto 60px; display: grid; gap: 30px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #6d5636; border-radius: 16px; background: #1d251f; box-shadow: 0 14px 38px #0008; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 18px 22px 22px; }
    h2 { margin: 0 0 7px; color: #f0c76a; }
    p { margin: 0; line-height: 1.5; color: #d8d5c9; }
    footer { text-align: center; color: #8e998e; padding: 20px; }
  </style>
</head>
<body>
<header>
  <h1>ValoriaTycoon — Direction artistique</h1>
  <p>Spawn médiéval-fantastique et grandes zones publiques classées.</p>
</header>
<main>
  <figure>
    <img src="medieval-spawn.png" alt="Concept du spawn médiéval ValoriaTycoon">
    <figcaption><h2>Spawn médiéval</h2><p>Place centrale, fontaine, château, marché et arches vers les quatre activités.</p></figcaption>
  </figure>
  <figure>
    <img src="massive-vanilla-caverns-v18.png" alt="Caverne vanilla géante avec portail de rang répulsif">
    <figcaption><h2>Cavernes organiques géantes</h2><p>Chaque zone mesure 2 048×2 048 blocs, dépasse cent blocs de hauteur et accueille plusieurs dizaines de joueurs. Le portail verrouillé repousse les joueurs sans le rang.</p></figcaption>
  </figure>
  <figure>
    <img src="massive-ranked-forests-v19.png" alt="Immense forêt Tycoon naturelle et portail de rang">
    <figcaption><h2>Forêts classées géantes</h2><p>Relief naturel, arbres aux silhouettes variées, chemins organiques et portail répulsif. Chaque essence occupe une île dédiée de 2 048×2 048 blocs.</p></figcaption>
  </figure>
  <figure>
    <img src="ranked-cavern-mines-v17-final.png" alt="Ancien schéma des quatre grottes minières">
    <figcaption><h2>Ancien schéma v17</h2><p>Archive utile pour la progression en quatre zones, mais remplacée par les cavernes organiques beaucoup plus vastes de la version 0.18.</p></figcaption>
  </figure>
  <figure>
    <img src="large-mine-zones.png" alt="Ancien concept des grandes zones minières">
    <figcaption><h2>Ancien concept de mines ouvertes</h2><p>Archive visuelle non utilisée, remplacée par les cavernes organiques géantes de la version 0.18.</p></figcaption>
  </figure>
  <figure>
    <img src="prison-tycoon-mine-v2.png" alt="Concept précis de la mine Prison Tycoon">
    <figcaption><h2>Ancien concept Prison/Tycoon</h2><p>Archive remplacée par les grottes minières fermées et leurs barrières de rang serveur.</p></figcaption>
  </figure>
  <figure>
    <img src="large-fields-forest-zones.png" alt="Ancien concept des grandes zones agricoles">
    <figcaption><h2>Champ Tycoon 5× plus grand</h2><p>5 120 blocs de diamètre, aucune eau visible, rangées quasi infinies et décorations en périphérie.</p></figcaption>
  </figure>
</main>
<footer>Concepts visuels — le rendu en jeu est généré procéduralement par le plugin.</footer>
</body>
</html>
