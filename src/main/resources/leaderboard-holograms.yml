enabled: true
world: valoria_spawn
# L’affichage vérifie le snapshot toutes les 5 secondes, sans aucune requête SQL.
update-interval-ticks: 100
top-entries: 5
# Une valeur vanilla de 1.0 représente la portée standard des Display entities.
view-range: 1.0
line-width: 260
shadowed: true
default-background: true

# Positions relatives au point /spawn généré (0.5, ground-y + 2, 26.5 par défaut).
categories:
  money: { offset-x: -18.0, offset-y: 3.0, offset-z: 6.0 }
  island-level: { offset-x: -9.0, offset-y: 3.0, offset-z: -4.0 }
  rank: { offset-x: 0.0, offset-y: 3.0, offset-z: -8.0 }
  production: { offset-x: 9.0, offset-y: 3.0, offset-z: -4.0 }
  playtime: { offset-x: 18.0, offset-y: 3.0, offset-z: 6.0 }
