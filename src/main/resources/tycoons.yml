# Îles Skyblock Tycoon privées générées automatiquement dans un monde vide.
reset:
  confirmation-seconds: 30
  blocks-per-tick: 2000

members:
  invite-expiration-seconds: 60

# Le fly est accordé gratuitement dans cette version. Une politique d'obtention
# (permission, upgrade, rang ou achat) pourra remplacer ce réglage plus tard.
flight:
  enabled: true
  allow-members: true
  void-rescue-below-floor: 32

tycoons:
  default:
    world: valoria_plots
    seed: 246813579
    size: 32
    spacing: 16
    max-players: 100
    origin-x: 0
    origin-z: 0
    floor-y: 80
    build-min-y: 72
    build-max-y: 180
    floor-material: GRASS_BLOCK
    base-material: DIRT
    island-radius: 13
    base-depth: 8
    world-border-size: 10000
    max-members: 10
