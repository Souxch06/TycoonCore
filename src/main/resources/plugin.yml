name: ValoriaTycoon
version: '${project.version}'
main: fr.valoriatycoon.ValoriaTycoonPlugin
api-version: '26.2'
authors: [ValoriaTycoon]
description: Modular Tycoon framework for Paper servers
website: https://github.com/Souxch06/ValoriaTycoon
softdepend: [Vault, PlaceholderAPI, NuVotifier, Votifier]

commands:
  is:
    description: Manages the player's private Skyblock parcel.
    usage: /is <menu|create|go|settings|visit|stats|upgrades|quests|reset|invite|accept|kick|members>
    aliases: [island, skyblock]
    permission: tycoon.island
  balance:
    description: Shows your internal Tycoon balance.
    usage: /balance
    aliases: [bal, money]
    permission: tycoon.balance
  pay:
    description: Transfers internal money to an online player.
    usage: /pay <player> <amount>
    permission: tycoon.pay
  farm:
    description: Opens the shared public farm-world selector.
    usage: /farm
    aliases: [farms, ressources]
    permission: tycoon.farm
  autosell:
    description: Opens the dedicated auto-sell management panel.
    usage: /autosell
    aliases: [asell]
    permission: tycoon.autosell
  shop:
    description: Opens the server shop, currently containing resource generators.
    usage: /shop
    permission: tycoon.shop
  rank:
    description: Opens medieval-rank requirements and promotion.
    usage: /rank
    permission: tycoon.ranks
  pets:
    description: Opens the player's pet collection and Pet Crate.
    usage: /pets
    permission: tycoon.pets
  top:
    description: Opens cached asynchronous Valoria leaderboards.
    usage: /top
    aliases: [classement, classements]
    permission: tycoon.leaderboards
  warp:
    description: Opens the Valoria warp selector or teleports directly to one destination.
    usage: /warp [destination]
    aliases: [warps]
    permission: tycoon.warp
  spawn:
    description: Teleports to the generated medieval server hub.
    usage: /spawn
    permission: tycoon.spawn
  isadmin:
    description: Skyblock administration command.
    usage: /isadmin <reload|give|setmoney|petkey|cratekey|create|reset|delete|debug>
    aliases: [islandadmin, skyblockadmin]
    permission: tycoon.admin

permissions:
  tycoon.island:
    description: Allows use of /is Skyblock commands.
    default: true
  tycoon.balance:
    description: Allows viewing one's balance.
    default: true
  tycoon.pay:
    description: Allows transferring internal money.
    default: true
  tycoon.farm:
    description: Allows opening and using shared farm worlds.
    default: true
  tycoon.autosell:
    description: Allows changing the farm auto-sell preference.
    default: true
  tycoon.tools:
    description: Allows opening and purchasing tool upgrades.
    default: true
  tycoon.pets:
    description: Allows adopting, leveling and activating pets.
    default: true
  tycoon.create:
    description: Allows creating a Tycoon.
    default: true
  tycoon.reset:
    description: Allows resetting one's Tycoon.
    default: true
  tycoon.members:
    description: Allows managing and accepting Tycoon memberships.
    default: true
  tycoon.upgrades:
    description: Allows purchasing upgrades unique to one's Skyblock parcel.
    default: true
  tycoon.machines:
    description: Allows placing and controlling island generators.
    default: true
  tycoon.quests:
    description: Allows viewing and progressing repeatable quests.
    default: true
  tycoon.ranks:
    description: Allows medieval rank promotions.
    default: true
  tycoon.leaderboards:
    description: Allows viewing cached server leaderboards.
    default: true
  tycoon.crates:
    description: Allows interacting with modeled Valoria crates at the market warp.
    default: true
  tycoon.shop:
    description: Allows opening the server shop.
    default: true
  tycoon.spawn:
    description: Allows teleporting to the generated medieval spawn.
    default: true
  tycoon.warp:
    description: Allows using the configurable /warp destinations.
    default: true
  tycoon.admin:
    description: Grants all ValoriaTycoon administration permissions.
    default: op
    children:
      tycoon.admin.reload: true
      tycoon.admin.economy: true
      tycoon.admin.pets: true
      tycoon.admin.crates: true
      tycoon.admin.plot: true
      tycoon.admin.debug: true
  tycoon.admin.reload:
    description: Allows reloading ValoriaTycoon configuration.
    default: op
  tycoon.admin.economy:
    description: Allows modifying balances.
    default: op
  tycoon.admin.pets:
    description: Allows creating and distributing authenticated physical pet keys.
    default: op
  tycoon.admin.crates:
    description: Allows issuing authenticated generic crate keys.
    default: op
  tycoon.admin.plot:
    description: Allows creating, resetting and deleting player Tycoon plots.
    default: op
  tycoon.admin.debug:
    description: Allows viewing internal diagnostics.
    default: op
  tycoon.bypass:
    description: Bypasses Tycoon plot protections.
    default: op
