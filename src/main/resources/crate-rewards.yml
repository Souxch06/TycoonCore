# Toutes les probabilités utilisent 10 000 points par caisse : 100 points = 1 %.
# Le montant exact, la ressource, la monnaie et les générateurs sont tirés une seule fois,
# puis stockés avec la récompense SQLite avant toute livraison physique.
money-bags:
  1: { minimum: '2000.00', maximum: '8000.00' }
  2: { minimum: '8000.00', maximum: '30000.00' }
  3: { minimum: '30000.00', maximum: '100000.00' }
  4: { minimum: '100000.00', maximum: '350000.00' }
  5: { minimum: '350000.00', maximum: '1250000.00' }

coin-bags:
  1: { minimum: 500, maximum: 2000 }
  2: { minimum: 2500, maximum: 10000 }
  3: { minimum: 12500, maximum: 40000 }
  4: { minimum: 50000, maximum: 125000 }
  5: { minimum: 150000, maximum: 350000 }

universal-coin-bag: { minimum: 40000, maximum: 80000 }

experience-vials:
  1: { minimum: 1, maximum: 3 }
  2: { minimum: 3, maximum: 6 }
  3: { minimum: 6, maximum: 10 }
  4: { minimum: 10, maximum: 15 }

resource-bundles:
  1: { minimum: 8, maximum: 16 }
  2: { minimum: 16, maximum: 32 }
  3: { minimum: 32, maximum: 64 }

# Un paquet ne choisit que parmi les zones déjà accessibles au joueur.
# Poissons et ressources compactées sont volontairement absents.
