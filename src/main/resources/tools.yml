# Progression des quatre formes du multi-tool. Aucune pelle : elle est inutile pour ce Tycoon.
multitool:
  enabled: true
  fishing-ray-distance: 6.0
  notify-switch: false
  # Le matériau physique et le modèle changent automatiquement avec le rang.
  # Chaque rang possède malgré tout sa propre texture, même lorsqu’un matériau est partagé.
  rank-tiers:
    0: WOODEN    # Sans rang
    1: WOODEN    # Citoyen
    2: STONE     # Artisan
    3: STONE     # Marchand
    4: IRON      # Écuyer
    5: IRON      # Chevalier
    6: GOLDEN    # Baron
    7: GOLDEN    # Vicomte
    8: DIAMOND   # Comte
    9: DIAMOND   # Marquis
    10: NETHERITE # Duc

menu:
  size: 27
  title: '<gold><bold>OUTIL • <tool></bold></gold>'
  info:
    slot: 4
    name: '<gold><tool></gold>'
    lore:
      - '<gray>Niveau outil : <yellow><tool_level></yellow></gray>'
      - '<gray>XP outil : <aqua><tool_xp>/<required_xp></aqua></gray>'
      - '<gray>Métier : <gold><profession> niveau <profession_level></gold></gray>'
      - '<gray>XP métier : <yellow><profession_xp>/<profession_required_xp></yellow></gray>'
      - '<gray><coin_name> : <green><coins></green></gray>'
  autosell:
    slot: 22
    icon: HOPPER
    maximum-icon: BEACON
    name: '<gold>Auto-sell global</gold>'
    maximum-name: '<light_purple>Auto-sell global maximum</light_purple>'
    lore:
      - '<gray>Niveau actuel : <yellow><level>/<max_level></yellow></gray>'
      - '<gray>Prochain multiplicateur : <gold>x<next_value></gold></gray>'
      - '<gray>Prix : <red><cost></red></gray>'
      - '<aqua>Synchronisé entre tous les outils.</aqua>'
      - '<yellow>Shift + clic pour acheter.</yellow>'
    maximum-lore:
      - '<gray>Niveau : <yellow><level>/<max_level></yellow></gray>'
      - '<gray>Multiplicateur : <gold>x<value></gold></gray>'
      - '<aqua>Actif pour tous les outils.</aqua>'

purchase-menu:
  size: 9
  title: '<gold><bold>PAIEMENT • <tool></bold></gold>'
  money:
    slot: 3
    icon: SUNFLOWER
    name: '<gold>Payer avec l’argent</gold>'
    lore:
      - '<gray>Prix : <red><money_cost></red></gray>'
      - '<gray>Solde : <yellow><money_balance></yellow></gray>'
      - '<green>Cliquez pour confirmer.</green>'
  coins:
    slot: 5
    name: '<green>Payer avec <coin_name></green>'
    lore:
      - '<gray>Prix : <red><coin_cost> <coin_name></red></gray>'
      - '<gray>Solde : <yellow><coins> <coin_name></yellow></gray>'
      - '<green>Cliquez pour confirmer.</green>'

ability-settings:
  speed-duration-ticks: 60
  speed-amplifier: 1
  speed-cooldown-seconds: 15
  maximum-timber-blocks: 4
  # Sécurité anti-insta-mine, même si la courbe est mal configurée.
  efficiency-hard-cap: '0.12'
  gem-coin-bonus: 25
  # Après la réussite de Pommes rares : pomme dorée 10 %, pomme de Notch 1 %.
  golden-apple-relative-chance: '0.10'
  notch-apple-relative-chance: '0.01'
  ufo-display-ticks: 40

progression:
  max-tool-level: 100
  base-experience: 100
  # Hausse régulière à l’intérieur d’un palier.
  experience-multiplier: '1.10'
  # Multiplicateur supplémentaire appliqué dès le niveau indiqué.
  # Les ruptures de palier ralentissent progressivement les niveaux avancés.
  difficulty-tiers:
    1: '1.00'
    21: '1.50'
    41: '2.25'
    61: '3.50'
    81: '5.00'
  flush-interval-ticks: 20

