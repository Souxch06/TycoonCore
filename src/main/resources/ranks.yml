# Le temps de jeu est cumulatif depuis la création du Skyblock.
# 20 160 minutes correspondent à 336 heures, soit environ deux semaines en jeu.
# Les niveaux XP vanilla sont consommés : onboarding à 20, puis courbe renforcée jusqu’à 1 000.
# Les objets suivent les quatre zones classées de mine/champs/forêt ; la pêche reste commune.
# Dès Écuyer, minerais/cultures/bûches sont demandés sous forme compacte ; les minerais passent par leurs blocs vanilla.
# Chaque rang accorde des avantages cumulatifs : revenus, XP, coins et générateurs.
