menu:
  size: 54
  title: '<font:valoriatycoon:gui></font><gold><bold>MES PETS</bold></gold>'
  filler: BLACK_STAINED_GLASS_PANE

# Les Clés Pets physiques proviennent de l'administration et des tables de caisses génériques.
crate:
  slot: 49
  icon: CHEST
  name: '<light_purple><bold>Caisse Pets</bold></light_purple>'
  lore:
    - '<gray>Consomme une clé physique et donne un œuf de pet échangeable.</gray>'
    - '<gray>Chaque œuf fixe définitivement sa variante normale ou chromatique.</gray>'
  chromatic-chance: '0.01'
  key-material: TRIPWIRE_HOOK
  key-name: '<light_purple><bold>Clé de la Caisse Pets</bold></light_purple>'
  key-lore:
    - '<gray>Clé physique échangeable entre joueurs.</gray>'
    - '<dark_gray>Utilisable depuis le menu Pets.</dark_gray>'
    - '<red>Chaque clé possède un identifiant unique anti-duplication.</red>'
  rarity-weights:
    COMMON: 60
    RARE: 25
    EPIC: 10
    LEGENDARY: 4
    MYTHIC: 1

# Tous les pets utilisent ce même œuf moddé. Les deux modèles sont fournis
# dans le pack de ressources ValoriaTycoon livré avec le projet.
egg:
  material: EGG
  normal-item-model: 'valoriatycoon:pet_egg'
  chromatic-item-model: 'valoriatycoon:pet_egg_chromatic'

reclaim:
  enabled: true
  world: valoria_spawn
  offset-x: -2.5
  offset-y: 0.0
  offset-z: 0.5
  yaw: 180.0
  name: '<aqua><bold>Gardien des Œufs</bold></aqua>'
  menu-title: '<font:valoriatycoon:gui></font><gold><bold>GARDIEN DES ŒUFS</bold></gold>'
  money-cost: '5000000.00'
  vanilla-xp-levels: 30

progression:
  flush-interval-ticks: 40
  experience-per-tool-action: 2
  experience-per-generator-cycle: 1

visual:
  follow-interval-ticks: 10

rarities:
  COMMON:
    name: '<gray>Commun</gray>'
    max-level: 25
    base-experience: 100
    experience-growth: '1.12'
  RARE:
