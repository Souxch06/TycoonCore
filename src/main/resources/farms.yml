# ValoriaTycoon - mondes publics de ressources à quatre zones classées.
menu:
  size: 27
  title: '<gold><bold>FARMS DE VALORIA</bold></gold>'

zone-menu:
  size: 27
  title: '<gold><bold><farm></bold></gold>
  locked-icon: BARRIER
  locked-name: '<red>Zone verrouillée — <zone></red>'
  locked-lore:
    - '<gray>Rang actuel : <yellow><current_rank></yellow></gray>'
    - '<gray>Rang requis : <red><required_rank></red></gray>'
    - '<red>Progressez avec /rank pour débloquer cette zone.</red>'

autosell-menu:
  size: 27
  title: '<gold><bold>VENTE AUTOMATIQUE</bold></gold>'
  slot: 12
  enabled-icon: LIME_DYE
  disabled-icon: GRAY_DYE
  locked-icon: BARRIER
  enabled-name: '<green>Vente automatique activée</green>'
  disabled-name: '<yellow>Vente automatique désactivée</yellow>'
  locked-name: '<red>Vente automatique verrouillée</red>'
  lore:
    - '<gray>Niveau : <yellow><level>/<max_level></yellow></gray>'
    - '<gray>Multiplicateur : <gold>x<multiplier></gold></gray>'
    - '<gray>Niveau 0 : Shift + clic droit avec un outil.</gray>'
    - '<gray>Une fois débloquée, cliquez pour basculer.</gray>'

teleport:
  cooldown-seconds: 3

rank-barrier:
  horizontal-knockback: 1.45
  vertical-knockback: 0.42

regeneration:
  check-interval-ticks: 10
  maximum-blocks-per-run: 250
  unloaded-retry-seconds: 15

autosell:
  max-level: 5
  levels:
    1: { cost: '100000.00', multiplier: '1.00' }
    2: { cost: '500000.00', multiplier: '2.00' }
    3: { cost: '2000000.00', multiplier: '3.00' }
    4: { cost: '10000000.00', multiplier: '4.00' }
    5: { cost: '50000000.00', multiplier: '5.00' }
  flush-interval-ticks: 20

# Les zones 1, 2, 3 et 4 se débloquent aux rangs 0, Artisan (2), Chevalier (5) et Comte (8).
