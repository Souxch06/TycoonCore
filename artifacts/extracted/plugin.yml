name: ValoriaTycoon
version: '1.6.3'
main: xyz.arcadiadevs.valoriatycoon.ValoriaTycoon
api-version: 1.13
authors:
  - Cuftica
  - OpenSource

softdepend:
  # Économie : un fournisseur d'économie enregistré auprès de Vault est indispensable, mais il n'est
  # PAS déclaré en `depend:`. Bukkit résout un depend: par le NOM exact du plugin et refuse alors de
  # charger le paquet (UnknownDependencyException) : ce blocage a touché des serveurs 26.x qui
  # n'utilisent pas l'original (figé à Vault 1.7.3 de 2020) mais le fork maintenu VaultUnlocked
  # (compatibilité 26.x déclarée). Les deux exposent le même service Economy via l'API des services,
  # donc la vraie vérification reste dans setupEconomy() : « Vault introuvable » ou « Aucun plugin
  # d'économie trouvé », messages explicites au lieu d'un refus muet.
  - Vault
  - VaultUnlocked
  # ProtocolLib n'est appelé par aucune classe du plugin (vérifié dans les .class livrés) : il n'est
  # utile que via HoloEasy, qui le déclare déjà de son côté. En dépendance dure, son absence (ou
  # l'absence d'un build compatible 26.x) empêchait Bukkit de charger ValoriaTycoon, hologrammes
  # désactivés ou non.
  - ProtocolLib
  - Oraxen
  - Essentials
  - ItemsAdder
  - IridiumSkyblock
  - SuperiorSkyblock2
  - ASkyBlock
  - AcidIsland
  - BentoBox
  - HoloEasy

commands:
  valoriatycoon:
    description: Commande principale de ValoriaTycoon
    usage: /valoriatycoon
  generators:
    description: Affiche la liste des générateurs dans une interface
    usage: /generators
    aliases: [ gen ]
  selldrops:
    description: Vend les drops présents dans l'inventaire
    usage: /selldrops
    aliases: [ sell ]
permissions:
  valoriatycoon.ah.use:
    description: Ouvrir le marché des joueurs.
    default: true
  valoriatycoon.ah.sell:
    description: Mettre un item en vente sur le marché.
    default: true
  valoriatycoon.ah.notify:
    description: Recevoir les annonces d'achat et de vente dans le chat.
    default: op
