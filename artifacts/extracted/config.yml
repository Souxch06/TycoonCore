developer-options:
  # Active les logs de debug du plugin.
  enabled: false
#YDVZZWN0hFVDhUVvZlUwgld4VkVPVTRWpUOrJGUSxGVKFTaUt0NP5GVJhFTOt0NP5GVJ92b
# Marché entre joueurs (/ah) : les items sont gardés en séquestre dans plugins/ValoriaTycoon/auction.yml
auction-house:
  enabled: true
  title: "&aMarché des joueurs"
  # Commission prélevée à la mise en vente (0.02 = 2 %), et reversée au vendeur à l'achat.
  sell-fee: 0.02
  min-price: 1.0
  max-price: 1000000.0
# Petit tableau de bord latéral (sidebar) : pseudo, solde, et lignes personnalisables.
scoreboard:
  enabled: true
  # 40 ticks = 2 secondes. Rester au-dessus de 10 pour ne pas bombarder le client.
  update-ticks: 40
  title: "&a&lValoriaTycoon"
  # Placeholders : %player% %money% %balance% %generators% %server% %ping%
  lines:
    - "&7Joueur : &f%player%"
    - "&7Solde : &a%money%"
    - "&7Connectés : &f%server%"
