# blockType est le type de bloc du générateur
# lore est la description du générateur (si vide, la description par défaut sera utilisée)
# itemSpawnLore est la description du drop (si vide, la description de drop par défaut sera utilisée)
# hologramLines correspond aux lignes d'hologramme du générateur (si vide, les lignes par défaut seront utilisées)
