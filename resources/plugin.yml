name: GensPlus
version: '1.6.3'
main: xyz.arcadiadevs.gensplus.GensPlus
api-version: 1.13
authors:
  - Cuftica
  - OpenSource

depend:
  - Vault
  - ProtocolLib

softdepend:
  - Oraxen
  - Essentials
  - ItemsAdder
  - IridiumSkyblock
  - SuperiorSkyblock2
  - ASkyBlock
  - AcidIsland
  - BentoBox
  - HoloEasy

commands:
  gensplus:
    description: Commande principale de GensPlus
    usage: /gensplus
    aliases: [ gens, gp ]
  generators:
    description: Affiche la liste des générateurs dans une interface
    usage: /generators
  selldrops:
    description: Vend les drops présents dans l'inventaire
    usage: /selldrops
