# Économie du serveur — un seul fichier de données : plugins/ValoriaEconomy/economy.yml

# Solde crédité à la première connexion d'un joueur (0 = pas de solde de départ).
starting-balance: 500.0

currency:
  # Préfixe affiché ; format() accepte les motifs java.util.Formatter,
  # %,.2f = séparateur de milliers + 2 décimales.
  plural: "$"
  singular: "$"
  format: "%,.2f"
