name: ValoriaEconomy
version: '1.6.3'
main: xyz.arcadiadevs.valoriaeconomy.ValoriaEconomy
# STARTUP : active avant tous les plugins POSTWORLD, donc le fournisseur d'economie est deja
# enregistre quand ValoriaTycoon le cherche dans son onEnable. L'interface Economy est EMBARQUEE
# dans CE jar (cote fournisseur, une seule copie a l'execution) : charge en STARTUP, ce plugin
# arrive AVANT le classloader de ValoriaTycoon — lui emprunter l'interface le rendait invalide au
# chargement (« Could not load plugin », Economy rouge, serveur du 2026-08-30).
# Aucun plugin externe n'est requis : ni Vault, ni EssentialsX.
load: STARTUP
api-version: '1.13'
description: Économie interne du serveur (soldes, /bal, /pay, /baltop, /eco).
authors:
  - ArcadieDevs

commands:
  bal:
    description: Afficher ton solde ou celui d'un joueur
    usage: /<command> [joueur]
    aliases: [balance, argent]
  pay:
    description: Envoyer de l'argent à un joueur
    usage: /<command> <joueur> <montant>
  baltop:
    description: Classement des soldes
    usage: /<command>
    aliases: [topmoney]
  eco:
    description: Administration des soldes
    usage: /<command> give|take|set|stats|reload [joueur] [montant]
    permission: valoriaeconomy.eco

permissions:
  valoriaeconomy.bal:
    description: Consulter un solde
    default: true
  valoriaeconomy.pay:
    description: Envoyer de l'argent à un joueur
    default: true
  valoriaeconomy.top:
    description: Voir le classement des soldes
    default: true
  valoriaeconomy.eco:
    description: Donner, retirer ou fixer un solde
    default: op
