      materials: [REDSTONE, REDSTONE_TORCH, REPEATER, COMPARATOR, OBSERVER, PISTON, STICKY_PISTON, HOPPER,
                  DROPPER, DISPENSER, SLIME_BLOCK, HONEY_BLOCK, RAIL, POWERED_RAIL, REDSTONE_LAMP,
