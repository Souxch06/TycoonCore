      materials: [COAL, IRON_INGOT, GOLD_INGOT, LAPIS_LAZULI, DIAMOND, EMERALD, QUARTZ, NETHERITE_SCRAP,
                  NETHERITE_INGOT, ANCIENT_DEBRIS, COPPER_INGOT, RAW_IRON, RAW_GOLD, RAW_COPPER, AMETHYST_SHARD,
