name: ValoriaTools
version: '1.6.3'
main: xyz.arcadiadevs.valariatools.ValoriaTools
# POSTWORLD (defaut) : l'outil n'a besoin de personne au demarrage. L'economie est detectee par
# reflexion (voir EconomyService) et relue 20 ticks apres l'activation, ce qui laisse le temps a
# ValoriaEconomy (load: STARTUP) de s'enregistrer — un ordre de chargement n'est donc PAS une
# condition de fonctionnement.
api-version: '1.13'
# PAS de `depend:` : Bukkit resout cette liste par le NOM EXACT du plugin et refuse alors de charger
# le paquet si une seule entree manque ou differe (UnknownDependencyException — le plantage qui a fait
# rougir le plugin sur ce serveur). ValoriaTools ne depend d'aucun plugin, y compris pas de
# ValoriaTycoon : tout est souplesse, tout a un repli.
# Aucun softdepend « pour faire joli » : ce paquet ne touche ni PlaceholderAPI ni un plugin de skyblock.
# Une dependance souple declaree sans code correspondant fait croire a une integration qui n'existe pas
# (c'etait le cas ici : quatre entrees, zero appel). La restriction de zone se fait par
# `tools.allowed-worlds`, en API Bukkit seule.
softdepend:
  - ValoriaEconomy
  - ValoriaTycoon
description: Multi-outil a ames commutantes (pioche, hache/houe, canne a peche, epee) ; capacites et baremes alignes sur le wiki GenTycoon, un niveau par capacite.
authors:
  - ArcadieDevs

commands:
  valariatools:
    description: Ouvre l'interface du multi-outil et ses sous-commandes
    usage: /<command> [gui|buy|give|sell|top|aide|set|ability|max|reset|stats|reload|help]
    aliases: [tools, outil, multitool]

permissions:
  valoria.tools.use:
    description: Ouvrir l'interface, acheter l'outil, l'utiliser, consulter le classement.
    default: true
  valoria.tools.give:
    description: Recevoir un multi-outil.
    default: true
  valoria.tools.admin:
    description: Forcer un palier ou un niveau de capacite, recharger la configuration, donner a autrui.
    default: op
