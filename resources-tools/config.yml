# ValoriaTools — multi-outil à âmes commutantes, barème aligné sur le wiki GenTycoon
#
# Principe : UN item, quatre comportements, choisis par le bloc visé. Chaque âme (pioche, hache/houe,
# canne, épée) a SON palier, et chaque capacité du wiki a SON niveau, acheté case par case dans le menu.
#
# Source du barème : https://wiki.gentycoon.fr/progression-metiers-and-outils/les-outils (Pioche 24,
# Houe 23, Épée 23, Canne 18 lignes) et les pages « Les Métiers » pour les gains par bloc, poisson ou
# monstre (table `jobs:` ci-dessous). Voir docs/WIKI-GENTYCOON-OUTILS.md : tableaux complets,
# correspondances, et la liste de ce que le wiki NE publie PAS (prix des niveaux et chances : réglages
# Valoria, assumés comme tels — le contrôle de config refuse toute valeur `jobs:` non publiée).
#
# Une ligne de capacité :
#   id           : clé de stockage du niveau acheté (unique par âme) — c'est elle que lit tools.yml
#   type         : le noyau compris par le moteur (liste en bas de ce fichier)
#   label        : le nom du wiki, tel quel
#   desc         : la description du wiki, telle quelle
#   unlock       : le palier d'âme qui autorise l'achat (« Level minimum » ou « Prestige mini » du wiki)
#   max-level    : le « Niveau max d'enchantement » du wiki (1 = capacité simple on/off)
#   free         : true = le niveau 1 est offert dès que le palier le permet
#   cle: 0.02 / cle-step / cle-cap   : valeur au niveau 1, pas par niveau, plafond
#   price / price-step / price-ratio / price-cap : prix du niveau suivant (sinon: défauts de l'âme)
#
# Régénéré par `python3 scripts/gen-tools-config.py` ; éditable ensuite, `/tools reload` suffit.

# Coupe tout le plugin (aucun événement traité). Utile pour tester sans retirer le jar.
enabled: true

tool:
  # Matériau de départ de l'item. Le comportement ne vient PAS de là : un NETHERITE_PICKAXE marqué vaut
  # pioche + hache + canne + épée. Ce n'est que l'apparence (et la solidité de base) — et, avec
  # `morph-by-target: true` plus bas, seulement l'apparence INITIALE : dès qu'une âme sert, c'est le
  # matériau de cette âme (`tools.<ame>.material`) qui prend la main.
  material: NETHERITE_PICKAXE
  display-name: "&6⚒ Multi-outil de Valoria"
  lore:
    - "&7Un seul outil : il change d'âme"
    - "&7selon le bloc que tu regardes."
    - ""
  # true = l'item ne s'use jamais. Recommandé : un outil qui se casse emporte l'ergonomie
  # (le joueur doit le redemander) et les paliers, eux, restent dans tools.yml.
  unbreakable: true
  # Cache les counters d'enchantement et de durabilité dans la tooltip.
  hide-flags: true
  # ------------------------------------------------------------------ la garde de l'objet
  # Ces trois réglages vont ensemble : ils font du multi-outil UN objet, un par joueur, qui ne se perd
  # pas. L'objet ne se lâche pas (touche Q), ne se range pas (coffre, baril, cadre, entonnoir, cheval,
  # ender chest), ne se donne pas, survit à la mort, et une deuxième copie est détruite à la connexion.
  # Le point sensible est auto-give : un outil qu'on ne peut ni poser ni donner devient une prison si le
  # joueur peut le perdre quand même (/clear, un gamemode qui recrée l'inventaire, un plugin qui purge
  # les sacs). auto-give: true garantit qu'il revient, donc que les deux autres sont sans risque.
  undroppable: true
  single-per-player: true
  auto-give: true
  # ------------------------------------------------------------------ ce que l'item montre
  # true = l'item PREND LE MATÉRIAU de l'âme avec laquelle tu es en train d'interagir : pic sur la
  # pierre, hache sur le tronc, canne au lancer, épée au coup. Le moteur choisissait déjà son âme bloc
  # par bloc — seule l'apparence était figée sur `material` ci-dessus, et le joueur ne pouvait donc pas
  # savoir quelle âme allait payer le prochain geste. false = l'item garde `material`, la lore seule
  # suit l'usage (un serveur qui vend des skins par pack de textures préfère souvent ne pas changer
  # l'objet lui-même).
  morph-by-target: true
  # Combien de capacités payées la lore de l'item énumère (`nom + niveau`, l'âme en cours seulement).
  # Au-delà, la tooltip dépasse l'écran et le reste est annoncé en une ligne avec le raccourci /tools :
  # un outil au maximum du barème a vingt-deux capacités payées, ce n'est pas lisible d'un coup.
  lore-abilities: 8
  # La vitesse de minage des capacités HASTE est posée TANT QUE l'outil est en main : réappliquée une
  # fois par seconde et à chaque changement de main, retirée dès que l'outil quitte la main, qu'on entre
  # dans un monde hors de `worlds`, ou à la déconnexion. Avant ce réglage, la vitesse n'était re-posée
  # qu'APRÈS un bloc cassé : invisible sur le premier bloc de la session et perdue dès qu'on regardait
  # un coffre entre deux filons — c'est exactement ce qu'un joueur appelle « mes capacités ne sont pas
  # actives, je casse les blocs normalement ». false = ancien comportement (uniquement à la cassure).
  haste-while-held: true
  # L'âme utilisée quand le joueur ne vise aucun bloc reconnu (clic dans le vide).
  fallback-tool: PICKAXE
  # Ce que coûte l'outil lui-même, via /tools buy. 0 = gratuit (/tools buy devient alors un give).
  # Avec auto-give: true, l'objet est déjà rendu à la connexion : ce prix n'est donc débité QUE par
  # /tools buy, jamais pour récupérer un outil perdu. C'est voulu — on ne facture pas un joueur d'un
  # accident du serveur — mais cela veut dire que ce n'est pas la porte d'entrée de l'économie.
  # C'est la premiere depense d'un tycoon : laisse-le a 0 tant que ton economie n'est pas reglee,
  # mais ne le remonte pas sans regarder `sell.prices` — le joueur rembourse l'outil en quelques
  # milliers de blocs, c'est ce calcul qu'il faut faire, pas un chiffre au pif.
  price: 0
  # Réservoir des capacités TREASURE (Trouvaille, Chercheur de spawner, Casino, bonbons…). Une
  # capacité peut déclarer SON PROPRE réservoir avec `items: [...]` : celui-ci sert de repli. On ne
  # touche pas à la table de trésors interne du serveur (reflection dans du privé, cassable à chaque
  # version) : on ajoute les objets listés, avec la probabilité de la capacité.
  treasure:
    items:
      - NAME_TAG
      - TRIPWIRE_HOOK
      - SUGAR

sell-on-break:
  # Multiplicateur global appliqué aux prix de `sell.prices` ci-dessous.
  multiplier: 1.0
  # En dessous de ce prix unitaire, rien n'est vendu (le joueur ramasse, sinon le chat sature).
  min-value: 0.05
  # true = la vente automatique ne se déclenche que accroupi (le geste du « je veux vendre »).
  only-when-sneaking: false
  # true = les blocs reconnus par une âme mais sans prix déclaré sont quand même mis dans le sac ;
  # false = ils tombent au sol. Les deux évitent l'accumulation d'un inventaire qui ne vend rien.
  auto-sell-unmatched: true

# Ce que l'outil mesure (stats.yml) et ou il a le droit d'agir : regles de serveur, pas de bareme.
stats:
  # false = aucun compteur tenu, /tools top reste vide et le menu n'affiche pas les lignes de mesure.
  # Rien dans le jeu ne depend des compteurs (classement et diagnostic d'equilibrage seulement) : on
  # peut les couper sans rendre l'outil fou.
  enabled: true

tools:
  # Les mondes ou l'outil agit (les ames s'en absterrent ailleurs : rien n'est casse, rien n'est paye).
  # Liste vide = tous les mondes. C'est la porte « zone protegeable » du plugin, et elle est 100 %
  # Bukkit : exiger une claim d'ile demanderait l'API d'un plugin de skyblock, dont ce dépôt ne depend
  # volontairement pas (le controle « zéro API tierce » du build refuserait meme de compiler l'appel).
  allowed-worlds: []

  # ──────────────────────── PIOCHE — 24 capacités du wiki ────────────────────────
  pickaxe:
    # Le matériau de l'item QUAND cette âme sert : avec `tool.morph-by-target: true`,
    # c'est lui que le joueur voit dans sa main (pic sur la pierre, hache sur le tronc),
    # et c'est aussi l'icône de la rangée dans le panneau. Le comportement ne vient pas
    # de là : il vient des capacités de cette âme.
    material: DIAMOND_PICKAXE
    # Les verrous reprennent le wiki : « Level minimum 45 » = palier 45 de l'âme.
    # L'âme pioche est celle qui mine les blocs durs et les minerais.
    matches:
      # Les tags suivent les nouveaux blocs tout seuls ; les noms sont le filet pour les
      # serveurs anciens (1.7-1.12) qui n'ont pas de registre de tags.
      tags:
        - "#minecraft:mineable/pickaxe"
      blocks: []
      namespaces: []
    harvest:
      # « Replantation instantanée » de la page Houe : la culture mûre est coupée et
      # remise à l'âge zéro dans le même geste. false = on récolte sans replanter.
      replant: true
    xp-per-block: 1
    durability-cost: 1
    upgrade:
      # 50 paliers : le wiki verrouille certaines capacités au « level 45 », et le
      # prestige (0 à 20) tient dans les vingt premiers. Un palier par capacité ouverte.
      max-tier: 50
      # Prix du palier suivant : base × ratio^palier, plafonné. Pas de liste de 49 prix :
      # `upgrade.prices: [...]` reste lu s'il est écrit, et prend alors la main.
      price-base: 1500
      price-ratio: 1.12
      price-cap: 2500000
    ability-price:
      # Repli pour une capacite ecrite a la main SANS `price:` — chaque ligne generee
      # porte deja son propre `price` + `price-ratio` + `price-cap`, donc ce bloc ne sert
      # qu'a l'admin qui ajoute une capacite sans reflechir a sa courbe.
      # Ce bloc est FRERE de `abilities:` et non dedans : un bloc YAML a la fois table
      # et sequence est invalide, et SnakeYAML jette a la lecture du config.yml du jar.
      base: 2000
      step: 400
      cap: 100000000
    abilities:
      - {id: efficacite, type: HASTE, label: "Efficacité", desc: "Augmente l'efficacité de la pioche permettant ainsi de casser les minerais plus rapidement", unlock: 1, max-level: 10, free: true, amplifier: 1, amplifier-step: 0.15, amplifier-cap: 5, duration: 60, price: 33000, price-ratio: 1.459233, price-cap: 100000000}
      - {id: charognard, type: RANDOM_ENCHANT, label: "Charognard", desc: "Donne une chance de trouver des enchantements aléatoires pour votre pioche", unlock: 5, max-level: 500, chance: 0.002, chance-step: 0.0001964, chance-cap: 0.1, level: 1, level-step: 0.01, level-cap: 5, enchants: [efficiency, fortune, unbreaking, mending], price: 1200, price-ratio: 1.009952, price-cap: 100000000}
      - {id: fortune, type: FORTUNE, label: "Fortune", desc: "Augmente la quantité de minerais récupérée en minant", unlock: 10, max-level: 10, chance: 0.02, chance-step: 0.09777778, chance-cap: 0.9, extra-min: 1, extra-max: 2, price: 33000, price-ratio: 1.459233, price-cap: 100000000}
      - {id: auto-smelt, type: AUTO_SMELT, label: "Auto-smelt", desc: "Fonte automatique des minerais (fonctionnalité annoncée en tête de page Pioche)", unlock: 15, max-level: 1, free: true, price: 250000, price-cap: 100000000}
      - {id: seconde-main, type: EXTRA_BLOCK, label: "Seconde main", desc: "Donne une chance de casser un minerai supplémentaire", unlock: 20, max-level: 100, chance: 0.05, chance-step: 0.00454546, chance-cap: 0.5, count: 1, count-step: 0.02, count-cap: 6, price: 5000, price-ratio: 1.045257, price-cap: 100000000}
      - {id: money-pouch, type: MONEY_POUCH, label: "Money Pouch", desc: "Donne une chance de trouver une grande quantité d'argent en cassant des minerais", unlock: 20, max-level: 2000, chance: 0.01, chance-step: 0.00024513, chance-cap: 0.5, amount: 25, amount-step: 1.5, amount-cap: 25000, per-block: 1, per-block-step: 0.01, per-block-cap: 8, price: 420, price-ratio: 1.002654, price-cap: 100000000}
      - {id: trouvaille, type: TREASURE, label: "Trouvaille", desc: "Donne une chance de trouver une clé boost en cassant des minerais", unlock: 15, max-level: 1000, chance: 0.005, chance-step: 0.00034535, chance-cap: 0.35, amount: 1, items: [TRIPWIRE_HOOK], price: 670, price-ratio: 1.005093, price-cap: 100000000}
      - {id: double-gain, type: MONEY_DOUBLE, label: "Double gain", desc: "Donne une chance de doubler l'argent gagné grâce à la vente automatique", unlock: 25, max-level: 1000, chance: 0.01, chance-step: 0.0004905, chance-cap: 0.5, multiplier: 2, price: 670, price-ratio: 1.005093, price-cap: 100000000}
      - {id: briseur, type: VEIN, label: "Briseur", desc: "Donne une chance de casser tous le filon de minerais", unlock: 30, max-level: 300, chance: 0.1, chance-step: 0.00167225, chance-cap: 0.6, max-blocks: 16, max-blocks-step: 1.5, max-blocks-cap: 200, similar-blocks-only: true, price: 1700, price-ratio: 1.016141, price-cap: 100000000}
      - {id: onde-sismique, type: AREA_BREAK, label: "Onde sismique", desc: "Donne une chance de provoquer un tremblement de terre qui casse tous les minerais à proximité", unlock: 40, max-level: 300, chance: 0.02, chance-step: 0.00160536, chance-cap: 0.5, radius: 1, radius-step: 0.02, radius-cap: 5, max-blocks: 27, max-blocks-step: 4, max-blocks-cap: 160, particles: 1, ores-only: true, price: 1700, price-ratio: 1.016141, price-cap: 100000000}
      - {id: pioche-fantomatique, type: GHOST_MINES, label: "Pioche fantomatique", desc: "Donne une chance de faire apparaître des pioches fantômes qui cassent les minerais automatiquement", unlock: 35, max-level: 300, chance: 0.02, chance-step: 0.00127091, chance-cap: 0.4, waves: 1, waves-step: 0.01, waves-cap: 8, radius: 2, radius-step: 0.01, radius-cap: 4, max-blocks: 12, max-blocks-step: 1, max-blocks-cap: 96, ores-only: true, price: 1700, price-ratio: 1.016141, price-cap: 100000000}
      - {id: proc-booster, type: PROC_BOOSTER, label: "Proc booster", desc: "Augmente le taux de déclenchement des enchantements", unlock: 40, max-level: 500, percent: 1, percent-step: 0.2, percent-cap: 300, price: 1200, price-ratio: 1.009952, price-cap: 100000000}
      - {id: braquage, type: MONEY_MULT, label: "Braquage", desc: "Augmente l'argent gagné en cassant des minerais", unlock: 1, max-level: 1000, percent: 1, percent-step: 0.5, percent-cap: 500, price: 670, price-ratio: 1.005093, price-cap: 100000000}
      - {id: booster-xp, type: XP_MULT, label: "Booster d'xp", desc: "Augmente l'expérience gagnée sur ta pioche en cassant des minerais", unlock: 1, max-level: 1000, percent: 1, percent-step: 0.4, percent-cap: 400, price: 670, price-ratio: 1.005093, price-cap: 100000000}
      - {id: chercheur-xp, type: XP_FLAT, label: "Chercheur d'xp", desc: "Donne une chance de trouver une plus ou moins grande quantité d'xp de pioche en minant", unlock: 1, max-level: 1000, chance: 0.02, chance-step: 0.00058059, chance-cap: 0.6, amount: 2, amount-step: 0.05, amount-cap: 120, price: 670, price-ratio: 1.005093, price-cap: 100000000}
      - {id: vente-auto, type: SELL_ON_BREAK, label: "Vente à la casse", desc: "Vend sur-le-champ ce qui est cassé, aux prix de la grille — l'équivalent Valoria de la vente automatique du wiki", unlock: 1, max-level: 1, free: true, price: 250000, price-cap: 100000000}
    jobs:
      # Gains du métier publiés par le wiki : Mineur — « Casser » (https://wiki.gentycoon.fr/progression-metiers-and-outils/les-metiers/mineur.md)
      # Clé = matériau cassé, objet pêché ou type d'entité tuée ; `gains` = argent,
      # `xp` = expérience vanilla rendue (le reliquat décimal est reporté, voir le
      # listener — 0,01 XP par roche arrondi bloc par bloc ne paierait jamais rien).
      # Ces montants s'AJOUTENT à la revente des drops ci-dessous, ils ne la remplacent pas.
      gains:
        ANCIENT_DEBRIS: 4
        ANDESITE: 0.07
        CHISELED_SANDSTONE: 0.45
        COAL_ORE: 0.5
        COPPER_ORE: 0.5
        CUT_SANDSTONE: 0.45
        DEEPSLATE_COAL_ORE: 0.5
        DEEPSLATE_COPPER_ORE: 0.5
        DEEPSLATE_DIAMOND_ORE: 3
        DEEPSLATE_EMERALD_ORE: 5
        DEEPSLATE_GOLD_ORE: 2
        DEEPSLATE_IRON_ORE: 0.88
        DEEPSLATE_LAPIS_ORE: 2
        DEEPSLATE_REDSTONE_ORE: 0.5
        DIAMOND_ORE: 3
        DIORITE: 0.07
        EMERALD_ORE: 5
        GOLD_ORE: 2
        GRANITE: 0.07
        IRON_ORE: 0.88
        LAPIS_ORE: 2
        NETHER_GOLD_ORE: 2
        NETHER_QUARTZ_ORE: 0.1
        OBSIDIAN: 2
        REDSTONE_ORE: 0.5
        STONE: 0.05
      xp:
        ANCIENT_DEBRIS: 4
        ANDESITE: 0.75
        CHISELED_SANDSTONE: 0.75
        COAL_ORE: 1.25
        COPPER_ORE: 1.25
        CUT_SANDSTONE: 0.75
        DEEPSLATE_COAL_ORE: 1.25
        DEEPSLATE_COPPER_ORE: 1.25
        DEEPSLATE_DIAMOND_ORE: 4.13
        DEEPSLATE_EMERALD_ORE: 5.13
        DEEPSLATE_GOLD_ORE: 2
        DEEPSLATE_IRON_ORE: 1.75
        DEEPSLATE_LAPIS_ORE: 2.13
        DEEPSLATE_REDSTONE_ORE: 2.25
        DIAMOND_ORE: 4.13
        DIORITE: 0.01
        EMERALD_ORE: 5.13
        GOLD_ORE: 2
        GRANITE: 0.25
        IRON_ORE: 1.75
        LAPIS_ORE: 2.13
        NETHER_GOLD_ORE: 2
        NETHER_QUARTZ_ORE: 0.01
        OBSIDIAN: 2.63
        REDSTONE_ORE: 2.25
        STONE: 0.01
    sell:
      multiplier: 1.0
      min-value: 0.05
      # Le barème de vente propre à cette âme : c'est ce que paient la capacité de vente
      # à la casse et `/tools sell`. Mets-y les prix de ton serveur, un par matériau.
      prices:
        COBBLESTONE: 1
        DEEPSLATE: 1.2
        DIAMOND: 60
        EMERALD: 45
        GOLD_INGOT: 20
        IRON_INGOT: 12
        COPPER_INGOT: 3
        REDSTONE: 4
        LAPIS_LAZULI: 5
        COAL: 3.5
        NETHERITE_SCRAP: 400
        NETHERRACK: 0.5
        STONE: 1
        GRANITE: 1
        DIORITE: 1
        ANDESITE: 1
        BLACKSTONE: 1.5
        END_STONE: 1.5
