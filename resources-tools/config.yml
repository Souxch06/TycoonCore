  # ──────────────────────── ÉPÉE — 23 capacités ────────────────────────
  sword:
    # Le matériau de l'item QUAND cette âme sert : avec `tool.morph-by-target: true`,
    # c'est lui que le joueur voit dans sa main (pic sur la pierre, hache sur le tronc),
    # et c'est aussi l'icône de la rangée dans le panneau. Le comportement ne vient pas
    # de là : il vient des capacités de cette âme.
    material: DIAMOND_SWORD
    # L'âme épée ne cible pas de bloc : elle s'active sur les entités vivantes, et ses
    # gains sont calculés à la mort du monstre (le seul moment où le serveur a décidé
    # qui a tué — donc impossible à farm sur un mob qui survit).
    matches:
      # Les tags suivent les nouveaux blocs tout seuls ; les noms sont le filet pour les
      # serveurs anciens (1.7-1.12) qui n'ont pas de registre de tags.
      tags:
        []
      blocks: []
      namespaces: []
    harvest:
      # « Replantation instantanée » de la page Houe : la culture mûre est coupée et
      # remise à l'âge zéro dans le même geste. false = on récolte sans replanter.
      replant: true
    xp-per-block: 0
    durability-cost: 1
    upgrade:
      # 50 paliers : le wiki verrouille certaines capacités au « level 45 », et le
      # prestige (0 à 20) tient dans les vingt premiers. Un palier par capacité ouverte.
      max-tier: 50
      # Prix du palier suivant : base × ratio^palier, plafonné. Pas de liste de 49 prix :
      # `upgrade.prices: [...]` reste lu s'il est écrit, et prend alors la main.
      price-base: 1500
      price-ratio: 1.12
      price-cap: 2500000
    ability-price:
      # Repli pour une capacite ecrite a la main SANS `price:` — chaque ligne generee
      # porte deja son propre `price` + `price-ratio` + `price-cap`, donc ce bloc ne sert
