      - {id: recolte-auto, type: CROP_HARVEST, label: "Récolte automatique", desc: "Casse la culture visée et ses voisines mûres, puis replante (fonctionnalité de tête de page Houe)", unlock: 1, max-level: 200, free: true, radius: 1, radius-step: 0.02, radius-cap: 3, max-blocks: 9, max-blocks-step: 4, max-blocks-cap: 81, flat: true, price: 2500, price-ratio: 1.023411, price-cap: 100000000}
      - {id: tree-fell, type: TREE_FELL, label: "Arbre abattu", desc: "Emporte le tronc et la canopée d'un seul coup — propre à l'âme hache, le wiki ne décrit que la houe", unlock: 1, max-level: 300, free: true, max-blocks: 64, max-blocks-step: 2, max-blocks-cap: 200, max-height: 8, max-height-step: 0.1, max-height-cap: 24, price: 1700, price-ratio: 1.016141, price-cap: 100000000}
      - {id: boost-xp, type: XP_MULT, label: "Boost XP", desc: "Augmente l'expérience gagnée sur ta houe en cassant des cultures", unlock: 1, max-level: 1000, percent: 1, percent-step: 0.4, percent-cap: 400, price: 670, price-ratio: 1.005093, price-cap: 100000000}
