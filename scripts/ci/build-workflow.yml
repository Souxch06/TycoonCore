name: Build and Validate ValoriaTycoon

# Workflow de validation pour les Pull Requests : il compile et contrôle le JAR sans jamais
# déployer sur le serveur (le déploiement SFTP reste réservé à main, voir .github/workflows/deploy.yml).
#
# IMPORTANT : ce fichier vit dans scripts/ci/ parce que le dépôt exige la permission
# `workflows` pour créer ou modifier un fichier sous .github/workflows/. Pour l'activer :
#
#     cp scripts/ci/build-workflow.yml .github/workflows/build.yml
#
# Les mêmes étapes peuvent être ajoutées à deploy.yml avant le dépôt SFTP ; les scripts
# invoqués (patch-class-version-patterns.py, rebrand-classes.py, verify-extraction.py,
# verify-paper26-compat.py) s'exécutent aussi bien en local, sans JDK ni réseau.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-validate:
    name: Compilation et contrôles de compatibilité
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Vérifier le renommage de marque dans les classes livrées
        run: python3 scripts/rebrand-classes.py --check

      - name: Vérifier les correctifs des classes vendorisées
        run: python3 scripts/patch-class-version-patterns.py --check

      - name: Vérifier la cohérence de l'extraction
        run: python3 scripts/verify-extraction.py

      - name: Compiler le plugin
        run: mvn -B -ntp clean package -DskipTests

      - name: Vérifier la compatibilité Paper 26.x du JAR
        run: |
          python3 scripts/verify-paper26-compat.py target/ValoriaTycoon-v1.6.3.jar
          python3 scripts/rebrand-classes.py --check --jar target/ValoriaTycoon-v1.6.3.jar

      - name: Publier le JAR construit
        uses: actions/upload-artifact@v4
        with:
          name: ValoriaTycoon-jar
          path: target/ValoriaTycoon-v1.6.3.jar
          if-no-files-found: error
